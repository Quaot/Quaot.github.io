title: Youtonomous
category: Desktop App
color: '#c8323c'
summary: |
  Youtonomous is a small Windows app for YouTube videos watched more than once. It downloads the video, remembers
  where the content starts, and opens it there every time.

  YouTube chapters become bookmarks, shown as ticks on the seek bar, and more can be added with a label. Keyboard
  shortcuts move between bookmarks and set the start point. Videos are downloaded with yt-dlp and played with
  libVLC.
