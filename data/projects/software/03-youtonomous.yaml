title: Youtonomous
subtitle: A YouTube player that skips straight to the content
role: Personal project
when: September 2026
status: Working
summary: Youtonomous is a small Windows app for YouTube videos that are watched more than once. It downloads a video,
  remembers where the content starts, and opens it there every time. YouTube chapters become bookmarks, and more
  can be added with a label.
points:
- Keyboard shortcuts move between bookmarks and set the start point.
- Videos are downloaded with yt-dlp and played with libVLC.
stack:
- C++
- CMake
- libVLC
- yt-dlp
