title: Youtonomous
subtitle: A YouTube player that skips straight to the content
role: Personal project
when: September 2026
status: Working
summary: >-
  A small Windows app in C++. It downloads a video once, remembers where the
  real content starts, and opens it there every time. Useful for lecture and
  study videos you replay often.
points:
  - Turns YouTube chapters into bookmarks, and lets you add your own with a label.
  - Keyboard control for everything, including jumping between bookmarks and setting the start point.
  - Uses yt-dlp to download and libVLC to play, with a CMake build and tests.
stack: [C++, CMake, libVLC, yt-dlp]
links:
  - label: Repository
    url: https://github.com/Quaot/youtonomous
