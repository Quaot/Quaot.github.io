title: Youtonomous
subtitle: A YouTube player that skips straight to the content
role: Personal project
when: September 2026
status: Working
summary: >-
  Long YouTube videos love to open with a few minutes of chatter. This small
  C++ app for Windows downloads a video once, remembers where the real content
  starts, and opens it there every time.
points:
  - Turns YouTube chapters into bookmarks, and lets you add your own with a label.
  - Keyboard shortcuts to seek, jump between bookmarks and set the start point.
  - Uses yt-dlp to download and libVLC to play, with a CMake build and tests.
stack: [C++, CMake, libVLC, yt-dlp]
links:
