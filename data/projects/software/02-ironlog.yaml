title: IronLog
category: App Design
color: '#cfe84a'
summary: |
  IronLog is an offline gym tracker for iPhone and the web. Weight and reps are set on scrolling sliders designed
  for one hand, and each set is filled in ahead of time with a suggested weight and the plates to load.

  It follows a ten-day training split, tracks each exercise across splits, and shows progress over a month or a
  year. All data stays on the phone, with no account required. The screens here show the app's built-in sample
  data.
