title: IronLog
subtitle: Offline gym tracker for iPhone and the web
role: Personal project
when: 2026
status: Built (web version being fixed)
summary: IronLog is an offline gym tracker for iPhone and the web. Weight and reps are set on scrolling sliders
  designed for one hand, and each set is filled in ahead of time with a suggested weight. All data stays on the
  phone, with no account required.
points:
- Follows a ten-day training split and tracks each exercise across splits.
- Progress can be viewed over a month or a year.
stack:
- TypeScript
- React
- PWA
- iOS
- Playwright
