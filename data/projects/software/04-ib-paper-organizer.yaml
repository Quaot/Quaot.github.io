title: IB Paper Organizer
subtitle: Searchable library for past exam papers
role: Personal project
when: December 2025 to September 2026
status: Released (v2.1.2)
summary: >-
  After a year of IB revision you end up with several hundred past papers in
  one folder, all named like MA-24M-P1-1-HL.pdf. This app reads those names,
  so finding a paper and its mark scheme takes a filter instead of a scroll.
points:
  - Parses each filename into subject, year, session, timezone, level and paper number, so you filter by what you want instead of reading filenames.
  - Started as a single HTML page in December 2025, then rebuilt as an Electron app with folder scanning and saved settings.
  - Only the main process touches the disk; the page gets a small set of allowed operations through the preload script.
stack: [Electron, JavaScript]
links:
