title: IB Paper Organizer
category: Desktop App
color: '#1f4fa3'
summary: |
  IB Paper Organizer turns a folder of several hundred IB past papers into a searchable library. Each filename is
  read into subject, year, session, timezone, level and paper number, and every paper is paired with its mark
  scheme on the same row.

  Papers are filtered by what they are, not by reading filenames. A paper or its mark scheme opens in a preview
  pane inside the app, which can go fullscreen or save a copy elsewhere. The exam page in the last picture is
  blurred because IB papers are under copyright.

  It started as a single HTML page in 2024 and has been maintained since, now at version 2.1.2.
