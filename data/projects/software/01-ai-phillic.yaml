title: AI-Phillic
category: App Design
summary: |
  AI-Phillic was our entry to IDEA-X 2026, a school district challenge on AI and critical thinking, made by four
  grade 12 students. My part was the app, and the rest of the team prepared the presentation. Of the 20 teams that
  entered, 8 reached the final, and AI-Phillic won first place and $10,000.

  The app teaches students to check what they read online. Each lesson is a short illustrated story, and students
  tap the claims they think were made up. A separate service splits a claim into single statements, searches the
  web and scholarly sources, and marks each source as supporting, contradicting or neutral.
