title: AI-Phillic
subtitle: Teaching students to check what they read online
role: Team of four
when: 2026
status: 1st place, $10,000
summary: AI-Phillic was our entry to IDEA-X 2026, a school district challenge on AI and critical thinking, made
  by four grade 12 students. Of the 20 teams that entered, 8 reached the final, and AI-Phillic won first place and
  $10,000. The app teaches students to check what they read online through short illustrated lessons, and a separate
  service checks a claim against real sources.
points:
- Lessons are told as short stories, and students tap the claims they think were made up.
- The service splits a claim into separate statements, searches the web and scholarly sources, and marks each source
  as for or against the claim.
- Pages the service cannot read are kept and marked for manual checking.
stack:
- TypeScript
- Expo
- React Native
- Express
- Zod
- Supabase
- Vitest
