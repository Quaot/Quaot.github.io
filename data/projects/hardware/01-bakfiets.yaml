title: Bakfiets F26
subtitle: Electrium Mobility electric cargo bike
role: Project lead
when: Fall 2026
status: In progress
summary: >-
  Electrium Mobility's electric cargo bike. The 2024 team designed the frame
  and cargo box and got partway through the build. This term I lead the
  25 people finishing it, and the first thing I did was make the project
  something a brand-new member could pick up on their own.
points:
  - Recovered the 2024 and 2025 CAD, firmware and wiring files from old branches and organised them into one repo, with a record of where each file came from.
  - Wrote the onboarding guide and 30 GitHub issues across all three subteams, each with steps, dependencies and safety notes.
  - Drew the system diagrams used in onboarding, including power flow, the 12S3P battery pack and the motor controller wiring.
stack: [GitHub, Python, SolidWorks, KiCad, ESP32-S3, VESC]
links:
