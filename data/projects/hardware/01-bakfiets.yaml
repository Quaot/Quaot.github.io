title: Bakfiets F26
subtitle: Electrium Mobility electric cargo bike
role: Project lead
when: Fall 2026
status: In progress
summary: Bakfiets is Electrium Mobility's electric cargo bike, and this term I lead the 25-person team finishing
  it, one of several projects in a club of about 70 members. The 2024 team designed the frame and cargo box and
  started the build. To help new members get going, I gathered the 2024 and 2025 files into one repository, wrote
  an onboarding guide and 30 GitHub issues, and drew the diagrams the team plans its work from.
points:
- The CAD, firmware and wiring files were recovered from old branches, with a record of where each one came from.
- Each GitHub issue lists its steps, dependencies and safety notes, across the mechanical, electrical and firmware
  subteams.
- The planning diagrams cover the power flow, the 12S3P battery pack and the motor controller wiring.
stack:
- GitHub
- Python
- SolidWorks
- KiCad
- ESP32-S3
- VESC
