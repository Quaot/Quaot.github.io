title: Bakfiets
category: Team Leadership
color: '#10545a'
summary: |
  Bakfiets is Electrium Mobility's electric cargo bike. This term I lead the 25-person team finishing it, one of
  several projects in a club of about 70 members.

  The bike was designed by the 2024 team in SolidWorks, and the pictures here are their model: a normal back half
  joined to a long, low frame that carries a wooden cargo box in front of the rider. The third picture sets the
  2024 assembly beside the rebuild the 2025 co-op students started.

  My work so far has been getting a new team going. I gathered the 2024 and 2025 files from old branches into one
  repository, wrote an onboarding guide and 30 GitHub issues across the mechanical, electrical and firmware
  subteams, and drew the diagrams the team plans its work from: the labelled bike, the onboarding path and the
  power flow from the battery through the motor controller.
