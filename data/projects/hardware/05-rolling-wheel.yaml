title: Rolling wheel experiment
category: Physics Experiment
summary: |
  My IB Physics internal assessment asked whether moving mass away from a wheel's axle makes it lose more energy
  rolling down a ramp.

  I designed the wheel in Fusion 360 and printed it in PLA: a 97 mm hollow shell with a spoked insert that holds
  twelve steel dowels. Two inserts with offset holes give 16 dowel positions, from 7.5 to 45 mm out from the axle,
  which sets the moment of inertia anywhere from 1.13 to 1.92 × 10⁻⁴ kg·m². The insert went through five versions,
  with thin test strips printed to check the fit first.

  Each position was rolled 30 times down a 1.5 m ramp at 8°, 480 rolls in all, filmed at 120 frames per second
  and tracked frame by frame in Tracker. The energy lost is the drop in potential energy minus the kinetic energy
  at the bottom, with every measurement uncertainty carried through to the result.

  The result was inconclusive. The line of best fit has a slope of 100 ± 400 J per kg·m², with R² = 0.07. The
  range of moments of inertia was too narrow, the printed shell was up to 0.5 mm out of round and wobbled, and the
  centre mark used for tracking was slightly off. Next time I would use heavier dowels and print the shell
  oversize, then sand it round.
