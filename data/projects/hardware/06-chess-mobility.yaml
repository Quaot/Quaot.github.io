title: Chess mobility
category: Math Modelling
color: '#4ea8de'
summary: |
  My IB Math HL exploration asked how much room a chess piece has to move, on average, as the board empties.

  I treated every other piece as placed at random and worked out how far a piece could go from each square before
  something stopped it. For the rook, bishop and queen that is a probability along each direction, where a friendly
  piece blocks its square and an enemy piece can be captured. For the knight and king only the destination squares
  matter. Averaging over all 64 squares gives the expected number of moves for each piece.

  Worked out for a standard board as pieces come off two at a time, the queen always has the most moves and gains
  them fastest, because clearing one square can open a whole line. The king beats the knight at every stage, since
  so many of the knight's jumps land off the board. The model leaves out check, pins and the shape of real games,
  which is its main limit.
