title: R-2R DAC
subtitle: 4-bit resistor ladder
role: Personal project
when: September 2026
status: Designed
summary: >-
  Four bits in, one voltage out, built from nothing but 10k and 20k
  resistors. I drew it in KiCad and checked it in SPICE. The board further
  down is a concept layout to show it fits on 33 by 20 mm; it hasn't been made.
points:
  - Looking back toward RT, every node sees 2R, so each bit contributes half as much voltage as the bit above it.
  - Used superposition to show that the output is the input voltage times the binary value over 16.
stack: [KiCad, SPICE]
links:
  - label: Repository
    url: https://github.com/Quaot/R-2R_DAC
