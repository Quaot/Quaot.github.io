title: R-2R DAC
category: Electronics
summary: |
  A 4-bit digital-to-analogue converter made only from 10k and 20k resistors.

  I drew the schematic in KiCad, simulated all 16 codes in SPICE, and checked each step on an oscilloscope in the
  E2 lab at the University of Waterloo. Looking back toward the terminating resistor, every node sees 2R, so each
  bit adds half as much voltage as the bit above it. In theory the output rises from 0 to 3.09 V in steps of
  0.206 V.

  The 33 by 20 mm circuit board shown first is a concept layout and has not been made.
