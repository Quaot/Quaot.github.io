title: 3.3 V regulator board
subtitle: 2-layer PCB with an LM1117 LDO
role: WATonomous Humanoid Electrical admission assignment
when: September 2026
status: Designed
summary: 'This board is my admission assignment for WATonomous''s Humanoid Electrical team: a two-layer regulator
  that takes 5 V in and gives 3.3 V out, built around the LM1117. Each part choice is worked out from its datasheet
  in the repository README. With every tolerance at its worst, the output stays between 3.20 and 3.44 V, and the
  calculated junction temperature is 116 °C on a 45 °C day, under the 125 °C recommended maximum. The board measures
  17 by 28 mm. Assignments are reviewed as design files, so it has not been manufactured.'
points:
- Set the output with a 162 Ω / 267 Ω divider, sized so the regulator always sees its 5 mA minimum load across 0
  to 125 °C.
- Worked through reference and resistor tolerances to show the output stays between 3.20 and 3.44 V, including the
  current the ADJ pin draws.
- Checked dropout at 500 mA. The board keeps regulating down to a 4.55 V input, or 4.69 V if the output sits at
  its 3.44 V worst case.
stack:
- Altium Designer
- LM1117
- Excel
