title: 3.3 V regulator board
category: PCB Design
color: '#1e6b4f'
summary: |
  A two-layer board that takes 5 V in and gives 3.3 V out, built around the LM1117. It is my admission assignment
  for WATonomous's Humanoid Electrical team.

  Each part choice is worked out from its datasheet in the repository README. A 162 Ω and 267 Ω divider sets the
  output and keeps the regulator above its 5 mA minimum load from 0 to 125 °C. With every tolerance at its worst,
  the output stays between 3.20 and 3.44 V. At 500 mA on a 45 °C day, the calculated junction temperature is
  116 °C, under the 125 °C recommended maximum, with 194 mm² of copper on the regulator tab.

  The board measures 17 by 28 mm. Assignments are reviewed as design files, so it has not been manufactured. The
  3D model is built from my Gerbers and the Altium STEP export.
