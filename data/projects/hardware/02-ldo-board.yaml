title: 3.3 V regulator board
subtitle: 2-layer PCB with an LM1117 LDO
role: WATonomous hardware onboarding
when: September 2026
status: Designed
summary: >-
  My WATonomous hardware onboarding task: a two-layer board that takes 5 V
  and hands back 3.3 V. The board is small. The real work was in the
  spreadsheet, making sure every part on it could be defended from a datasheet.
points:
  - Set the output with a 162 Ω / 267 Ω divider, sized so the regulator always sees its 5 mA minimum load across 0 to 125 °C.
  - Worked through reference and resistor tolerances to show the output stays between 3.20 and 3.44 V, inside the JEDEC 3.15 to 3.45 V narrow range.
  - Checked dropout at 500 mA, so the board keeps regulating down to a 4.55 V input.
stack: [Altium Designer, LM1117, Excel]
