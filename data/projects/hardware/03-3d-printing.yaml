title: 3D printing
subtitle: Fusion 360 and parametric Python CAD
role: Personal projects
when: 2025 to now
status: Two printed, two in progress
summary: >-
  I print in PLA on an Anycubic Mega Pro. The early parts were drawn in
  Fusion 360 and refined print by print. The newer ones are Python scripts,
  so changing a clearance means editing one number, and GitHub checks every change.
points:
  - "IB Physics sensor mount: a 100 mm holder with insert discs, refined over five versions and a set of fit-test strips before the final print."
  - "Switch fidget: a pocket toy built around a mechanical keyboard switch, with printable test coupons to dial in the fit before printing the real part."
  - "PCB enclosure generator: reads a KiCad board file and builds a case with standoffs under each mounting hole and openings for chosen connectors."
stack: [Fusion 360, Python, build123d, KiCad, Cura, GitHub Actions]
links:
