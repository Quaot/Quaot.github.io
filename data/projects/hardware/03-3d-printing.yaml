title: 3D printing
category: Product Design
summary: |
  Parts printed in PLA on an Anycubic Mega Pro. The earlier ones were modelled in Fusion 360. The newer ones are
  generated by Python scripts using build123d, so a dimension can be changed in one place.

  The IB Physics sensor mount is a 100 mm holder with insert discs. The insert went through five versions over
  three days, with thin test strips and a short test ring printed to check the fit before the final part.

  The switch fidget is a pocket toy built around a mechanical keyboard switch. Test coupons for the switch cutout,
  from 13.8 to 14.3 mm, and for the keycap stem come first, and the fidget itself has not been printed yet. The
  enclosure generator reads a KiCad board file and builds a case with standoffs under each mounting hole.
