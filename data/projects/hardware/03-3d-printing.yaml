title: 3D printing
subtitle: Fusion 360 and parametric Python CAD
role: Personal projects
when: 2025 to now
status: Two printed, two in progress
summary: These parts are printed in PLA on an Anycubic Mega Pro. The earlier ones were modelled in Fusion 360; the
  newer ones are generated by Python scripts using build123d, so a dimension can be changed in one place. The IB
  Physics sensor mount went through five insert versions and a set of fit-test strips before the final print.
points:
- 'IB Physics sensor mount: a 100 mm holder with insert discs, refined over five versions and a set of fit-test
  strips before the final print.'
- 'Switch fidget: a pocket toy built around a mechanical keyboard switch, with printable test coupons to dial in
  the fit before printing the real part.'
- 'PCB enclosure generator: reads a KiCad board file and builds a case with standoffs under each mounting hole and
  openings for chosen connectors.'
stack:
- Fusion 360
- Python
- build123d
- KiCad
- Cura
- GitHub Actions
