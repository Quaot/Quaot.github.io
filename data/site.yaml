name: Justin Gu
tagline: Electrical Engineering student at the University of Waterloo, class of 2031. Project lead for Electrium Mobility's electric cargo bike.
intro: >-
  I like projects where the design has to survive contact with something real:
  a frame that has to carry a rider, a board that has to hold 3.3 V, an app that
  a student actually opens twice.

