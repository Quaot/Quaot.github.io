about: |-
  I'm a first-year Electrical Engineering student at the University of Waterloo, class of 2031. Before that I finished the IB Diploma in Langley, BC, with 40 out of 45, and spent a year and a half as a junior coach at Zebra Robotics, keeping three competition teams' robots running and teaching kids to code.

  This fall I'm project lead for Bakfiets, Electrium Mobility's electric cargo bike, and I'm doing the admission assignment for WATonomous's Humanoid Electrical team. I'm also one of six academic reps for my class.

  Most of what's on this site started as a spec someone handed me or a problem I kept running into. I like the stage where the numbers have to agree with a datasheet, or a print has to fit on the first try. It rarely does, which is why there are test strips.
