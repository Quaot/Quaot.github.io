hero_model:
  src: media/printing/enclosure-base.stl
  caption: Enclosure base generated from a KiCad board file by my Python script. Drag to rotate.

about: >-
  This fall I'm leading Bakfiets, Electrium Mobility's electric cargo bike, and
  working through WATonomous's hardware onboarding. I'm also one of six academic
  reps for my Electrical Engineering class. Outside design teams I build
  software for problems I run into myself: a tool for sorting past papers, a
  gym tracker, and an app that teaches students to check what they read online.

