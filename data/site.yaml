about: 'Before Waterloo, I completed the IB Diploma in Langley, BC, with a score of 40 out of 45. I coached robotics
  at Zebra Robotics, where classes were mostly in Scratch and Python, and spent the summer of 2026 as the UI/UX
  designer at ForgeX Trading.


  This term I lead Bakfiets, a 25-person team within Electrium Mobility building an electric cargo bike. I was also
  elected by the roughly 150 students in my Electrical Engineering class as one of six academic representatives,
  and I am completing the admission assignment for WATonomous''s Humanoid Electrical team.


  If you would like to discuss a co-op position or any of the projects here, contact me at gujustin1@gmail.com.'
