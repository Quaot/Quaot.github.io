<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><style>
  .bg { fill: #f2f2f2; } .ink { fill: #111; } .muted { fill: #8a8a8a; }
  .line { stroke: #111; } .hair { stroke: #d6d6d6; } .track { fill: #dcdcdc; }
  .accent { fill: #d4892f; } .accent-line { stroke: #d4892f; }
  text { font-family: 'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif; }
  @media (prefers-color-scheme: dark) {
