# This site moved to https://justin.brogu.ca (repo chatpoc-ai/justin-site).
# What's published here is only redirect/: every old address sends visitors to the same address on the new site,
# so links already shared (projects, profile, the résumé PDF, old #/ links) keep working.
name: Publish redirects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
